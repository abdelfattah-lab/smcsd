[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "smcsd"
version = "0.1.0"
description = "SMC (Sequential Monte Carlo) speculative decoding engine built on SGLang."
requires-python = ">=3.12"
# sglang is not listed here: install it editable from 3rdparty/sglang/python
# before (or together with) this package.
dependencies = []

[project.optional-dependencies]
train = [
    "accelerate",
    "datasets",
    "peft",
    "transformers",
]
test = ["pytest"]

[tool.pytest.ini_options]
norecursedirs = [
    "3rdparty",
    ".venv",
    "artifacts",
    "benchmark_logs",
    "benchmark_reports",
    "runs",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["smcsd*"]
exclude = ["3rdparty*", "scripts*", "tests*"]
